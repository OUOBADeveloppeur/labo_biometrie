import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
    id 'org.greenrobot.greendao'
}

android {
    namespace 'com.hf.tr760'
    compileSdk 34

    buildFeatures {
        viewBinding = true
    }

    defaultConfig {
        applicationId "com.hf.tr760"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "1.0.17"
        flavorDimensions = ["fingerprint"]
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    greendao {
        schemaVersion 2
        daoPackage 'com.hf.tr760.facex.greendao.gen'
        targetGenDir 'src/main/java'
    }

    sourceSets {
        main {
            jniLibs.srcDir 'libs'
        }
    }

    // 自定义APK文件名
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "tr760Plus_v${versionName}_${releaseTime()}.apk"
        }
    }

    signingConfigs {
        release {
            storeFile file('dt.jks')
            storePassword '111111'
            keyAlias 'dtKey'
            keyPassword '111111'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        // 启用pickFirst策略
        pickFirst 'META-INF/rxjava.properties'
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        pickFirst "lib/arm64-v8a/libc++_shared.so"
        pickFirst "lib/armeabi-v7a/libc++_shared.so"
    }

    productFlavors {
        fap60 {
            dimension "fingerprint"
        }

        sm861 {
            dimension "fingerprint"
        }
    }

}

//获取时间
static def releaseTime() {
    return new SimpleDateFormat("yyyy-MM-dd-HH-mm", Locale.CHINA).format(new Date())
}

dependencies {
    api fileTree(include: ['*.aar', '*.jar'], dir: 'libs')
    fap60Api fileTree(include: ['*.aar', '*.jar'], dir: 'src/fap60/libs')
    sm861Api fileTree(include: ['*.aar', '*.jar'], dir: 'src/sm861/libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.3.0'
    //基础框架
    implementation 'com.alibaba:fastjson:1.2.79'
    api project(':ui')
    api project(':lib-eyecooliris-uvc')

    // 友盟基础组件库（所有友盟业务SDK都依赖基础组件库
    implementation 'com.umeng.umsdk:common:+'// 必选
    implementation 'com.umeng.umsdk:asms:+'// 必选
    implementation 'com.umeng.umsdk:apm:+'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    implementation('com.github.li-xiaojun:XPopup:2.10.0')
    api project(':lib-passport')

    //db
    implementation 'org.greenrobot:greendao:3.3.0'
    implementation 'io.github.yuweiguocn:GreenDaoUpgradeHelper:v2.2.1'
    implementation fileTree(dir: '../palm/libs', include: ['*.aar'])
    implementation project(":palm")
}