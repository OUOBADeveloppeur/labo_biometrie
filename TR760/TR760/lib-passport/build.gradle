dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar','*.aar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.leon:lfilepickerlibrary:1.8.0'

    // passport
    implementation 'org.jmrtd:jmrtd:0.7.42'
    implementation 'net.sf.scuba:scuba-sc-android:0.0.18'
    implementation 'com.madgag.spongycastle:prov:1.54.0.0'
    implementation 'com.gemalto.jp2:jp2-android:1.0.3'
    implementation 'commons-io:commons-io:2.8.0'

    // eventbus
    implementation 'org.greenrobot:eventbus:3.1.1'

    // stepview
    implementation 'com.params.stepview:stepview:1.0.2'

    // aspectj
    implementation 'org.aspectj:aspectjrt:1.9.6'

//    implementation 'com.google.mlkit:face-detection:16.1.6'
//    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation "com.google.android.gms:play-services-mlkit-text-recognition:18.0.0"

    implementation 'androidx.camera:camera-core:1.0.0-beta05'
    implementation 'androidx.camera:camera-camera2:1.0.0-beta05'
}
